<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="background">
      <img src="https://lh3.googleusercontent.com/ZokGCSsn0836X4Dt0SBNQYzavqQcGL-WDeMBNOSGqe5MGK9dp_JATWJTyWk4eRIFW4xhVovtugcq0Ynssvejel3Nc_v7T8c61UWz2LAL9SbHaJ8kTs5KRc_pAvmuJut1eMNQmw-e" alt="">
    </div>
    <div class="account-box" id="login">
      <h2>Login</h2>
      <form id="login-form">
        <div class="user-box">
          <input
            id="email"
            type="text"
            name=""
            required=""
            placeholder="Email"
          />
        </div>
        <div class="user-box">
          <input
            id="password"
            type="password"
            name=""
            required=""
            placeholder="Password"
          />
        </div>
        <div class="selector">
          <a class="account" href="register.html">Bạn chưa có tài khoản?</a>
          <button type="submit" class="btn" id="submit">Submit</button>
        </div>
      </form>
    </div>
    <script type="module" src="./class/firebase.js"></script>
    <script type="module" src="./Condition.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
